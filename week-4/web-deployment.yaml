apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: web
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
          image: week-4-web:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://localhost:5000')
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: web
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
